<!doctype html>
<!--
  ah ahh "Now Playing" overlay. Add to OBS as a Browser Source:
    URL:    http://127.0.0.1:10770/overlay
    Size:   600 x 160
  Options (query string):
    ?hidePaused=1   fade out while paused
    ?noProgress=1   hide the progress bar
    ?align=right    anchor the card to the right edge
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>ah ahh — Now Playing</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .stage {
        display: flex;
        padding: 16px;
      }
      .stage.right {
        justify-content: flex-end;
      }
      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        width: 520px;
        max-width: calc(100vw - 32px);
        padding: 14px 18px 14px 14px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        color: #111;
        overflow: hidden;
        transition: opacity 400ms ease, transform 400ms ease;
      }
      .card.hidden {
        opacity: 0;
        transform: translateY(12px);
      }
      .backdrop {
        position: absolute;
        inset: -100px;
        background-size: cover;
        background-position: center;
        filter: blur(50px) saturate(1.8);
        z-index: 0;
      }
      /* White frost over the blurred artwork. */
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.18);
        z-index: 0;
      }
      .art {
        position: relative;
        z-index: 1;
        flex: none;
        width: 76px;
        height: 76px;
        border-radius: 10px;
        background: #26262d center / cover;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      }
      .meta {
        position: relative;
        z-index: 1;
        min-width: 0;
        flex: 1;
      }
      .title,
      .artist {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .title {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.2;
      }
      .artist {
        font-size: 19px;
        color: rgba(0, 0, 0, 0.62);
        margin-top: 2px;
      }
      .progress {
        margin-top: 10px;
        height: 4px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }
      .progress > div {
        height: 100%;
        width: 0;
        background: #111;
        border-radius: 2px;
      }
      /* Dark artwork: light text. */
      .card.dark {
        color: #fff;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
      }
      .card.dark .artist {
        color: rgba(255, 255, 255, 0.75);
      }
      .card.dark .progress {
        background: rgba(255, 255, 255, 0.25);
      }
      .card.dark .progress > div {
        background: #fff;
      }
      .no-progress .progress {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="card hidden" id="card">
        <div class="backdrop" id="backdrop"></div>
        <div class="art" id="art"></div>
        <div class="meta">
          <div class="title" id="title"></div>
          <div class="artist" id="artist"></div>
          <div class="progress"><div id="bar"></div></div>
        </div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const hidePaused = params.get('hidePaused') === '1';
      if (params.get('noProgress') === '1') document.body.classList.add('no-progress');
      if (params.get('align') === 'right') document.getElementById('stage').classList.add('right');

      const $ = (id) => document.getElementById(id);
      let state = { playing: false };

      function render() {
        const visible = Boolean(state.title) && (state.playing || !hidePaused);
        $('card').classList.toggle('hidden', !visible);
        if (!state.title) return;
        $('title').textContent = state.title;
        $('artist').textContent = state.artist || '';
        const art = state.artwork ? `url("${state.artwork}")` : 'none';
        $('art').style.backgroundImage = art;
        $('backdrop').style.backgroundImage = art;
        if (state.artwork !== lastArtwork) setTone((lastArtwork = state.artwork));
      }

      // Picks light or dark text from the average colour of the artwork's middle band
      // (the part the wide card shows).
      let lastArtwork;
      function setTone(url) {
        $('card').classList.remove('dark');
        if (!url) return;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          if (url !== lastArtwork) return;
          const ctx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, img.height * 0.3, img.width, img.height * 0.4, 0, 0, 1, 1);
          const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
          $('card').classList.toggle('dark', 0.2126 * r + 0.7152 * g + 0.0722 * b < 140);
        };
        img.src = url;
      }

      function tick() {
        if (state.durationMs) {
          const elapsed = state.playing ? Date.now() - state.updatedAt : 0;
          const position = Math.min(state.positionMs + elapsed, state.durationMs);
          $('bar').style.width = `${(position / state.durationMs) * 100}%`;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      const events = new EventSource('/now-playing/events');
      events.onmessage = (event) => {
        state = JSON.parse(event.data);
        render();
      };
    </script>
  </body>
</html>
